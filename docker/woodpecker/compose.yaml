name: mindsync-ci

# Woodpecker CI next to the existing Gitea instance.
# The server talks to Gitea over the internal container network; the agent
# needs the host Docker socket to start one container per pipeline step.

services:
  server:
    image: ${WOODPECKER_SERVER_IMAGE:?Set a pinned Woodpecker server image}
    container_name: woodpecker-server
    restart: unless-stopped
    environment:
      # Must be reachable both from the Gitea container (webhooks) and from
      # your browser (login), so use the NAS LAN address here, not a container name.
      WOODPECKER_HOST: ${WOODPECKER_HOST:?Set the public URL, for example http://192.168.1.10:8000}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: ${GITEA_INTERNAL_URL:-http://gitea:3000}
      WOODPECKER_GITEA_CLIENT: ${GITEA_CLIENT_ID:?Create a Gitea OAuth2 application first}
      WOODPECKER_GITEA_SECRET: ${GITEA_CLIENT_SECRET:?Create a Gitea OAuth2 application first}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?Generate a long random string}
      # Your Gitea username: it becomes the Woodpecker admin on first login.
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:?Set your Gitea username}
      WOODPECKER_OPEN: "false"
      WOODPECKER_DATABASE_DRIVER: sqlite3
      WOODPECKER_DATABASE_DATASOURCE: /var/lib/woodpecker/woodpecker.sqlite
      WOODPECKER_LOG_LEVEL: ${WOODPECKER_LOG_LEVEL:-info}
    volumes:
      - ./data/server:/var/lib/woodpecker
    ports:
      # Bind to 0.0.0.0 only when you reach it through the LAN; otherwise
      # use 127.0.0.1 with a reverse proxy in front.
      - "${WOODPECKER_BIND_ADDRESS:-0.0.0.0}:${WOODPECKER_PORT:-8000}:8000"
    networks: [ci, gitea]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  agent:
    image: ${WOODPECKER_AGENT_IMAGE:?Set a pinned Woodpecker agent image}
    container_name: woodpecker-agent
    restart: unless-stopped
    environment:
      WOODPECKER_SERVER: server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?Generate a long random string}
      WOODPECKER_MAX_WORKFLOWS: ${WOODPECKER_MAX_WORKFLOWS:-2}
      # Pipeline step containers join the Gitea network so that "gitea" and
      # service names such as "postgres" resolve from inside the steps.
      WOODPECKER_BACKEND_DOCKER_NETWORK: ${GITEA_NETWORK:-gitea_default}
      WOODPECKER_LOG_LEVEL: ${WOODPECKER_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/agent:/etc/woodpecker
    networks: [ci]
    depends_on: [server]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ci: {}
  gitea:
    external: true
    name: ${GITEA_NETWORK:-gitea_default}
