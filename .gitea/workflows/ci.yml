name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and bundle
        run: npm run build

  server:
    # Requires a runner labelled "ubuntu-rust"; see docs/ci.md for the image.
    runs-on: ubuntu-rust
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: mindsync_test
          POSTGRES_USER: mindsync
          POSTGRES_PASSWORD: mindsync
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://mindsync:mindsync@postgres:5432/mindsync_test
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Integration tests
        run: cargo test --locked
